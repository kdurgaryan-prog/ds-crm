# Render Blueprint for PRODUCTION. Add it after staging works:
# Render → New → Blueprint → ds-crm → set "Blueprint Path" to render.production.yaml

services:
  - type: web
    name: dscrm-production
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    buildCommand: npm ci && npm --prefix web ci && npm run build:web
    startCommand: node server/src/index.js
    healthCheckPath: /healthz
    autoDeployTrigger: off            # production updates only when you click "Deploy"
    disk:
      name: dscrm-production-files
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: APP_ENV
        value: production
      - key: DELIVERY_MODE
        value: live
      - key: NODE_VERSION
        value: "22"
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: dscrm-production-db, property: connectionString }
      - key: PUBLIC_URL                # https://crm.dssuniforms.com
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SITE_ORIGINS
        value: https://dssuniforms.com,https://www.dssuniforms.com

databases:
  - name: dscrm-production-db
    databaseName: dscrm
    user: dscrm_app
    postgresMajorVersion: "16"
    region: oregon
    plan: 0.1c-256mb               # smallest; upgrade in Render later if needed
    ipAllowList: []
