# Render Blueprint: creates the STAGING CRM (test environment) with its own database and file disk.
# Production is a separate Blueprint (render.production.yaml) you add once staging is tested.
# Render dashboard → New → Blueprint → pick this repository. You will be asked for the values marked sync:false.
# Staging never delivers messages, calls or posts (they are stored as "test mode"), whatever its settings say.

services:
  - type: web
    name: dscrm-staging
    runtime: node
    region: oregon                     # closest to Los Angeles
    plan: 0.5c-512mb                   # must not be "free": free services sleep and miss Twilio calls
    buildCommand: npm ci && npm --prefix web ci && npm run build:web
    startCommand: node server/src/index.js   # applies database migrations on start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: dscrm-staging-files
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: staging
      - key: DELIVERY_MODE
        value: sandbox
      - key: NODE_VERSION
        value: "22"
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: APP_ENCRYPTION_KEY
        generateValue: true            # 32 random bytes; keep it — stored channel keys depend on it
      - key: DATABASE_URL
        fromDatabase: { name: dscrm-staging-db, property: connectionString }
      - key: PUBLIC_URL                # e.g. https://staging-crm.dssuniforms.com (or the onrender.com address)
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SITE_ORIGINS
        value: https://dssuniforms.com,https://www.dssuniforms.com

databases:
  - name: dscrm-staging-db
    databaseName: dscrm
    user: dscrm_app
    postgresMajorVersion: "16"
    region: oregon
    plan: 0.1c-256mb
    ipAllowList: []                    # reachable only from your Render services
